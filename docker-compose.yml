services:
  postgres:
    image: postgres:16-alpine
    container_name: izischool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-izischool_db}
      POSTGRES_USER: ${DB_USERNAME:-izischool_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-izischool_secret_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-izischool_user} -d ${DB_NAME:-izischool_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: izischool-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: izischool-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8085}:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
      - keycloak_data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy

  izischool-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: izischool-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/izischool_db
      DB_USERNAME: ${DB_USERNAME:-izischool_user}
      DB_PASSWORD: ${DB_PASSWORD:-izischool_secret_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/izischool
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/izischool/protocol/openid-connect/certs
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  keycloak_data:

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.izischool.internal/realms/izischool
          jwk-set-uri: https://keycloak.izischool.internal/realms/izischool/protocol/openid-connect/certs

izischool:
  default-currency: XOF
  default-timezone: UTC

spring:
  application:
    name: izischool-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

izischool:
  default-currency: ${DEFAULT_CURRENCY:XOF}
  default-timezone: ${DEFAULT_TIMEZONE:UTC}
  security:
    auth-enabled: ${AUTH_ENABLED:false}
    jwt:
      client-id: ${KEYCLOAK_CLIENT_ID:izischool-api}
  dev-seed:
    enabled: ${DEV_SEED_ENABLED:true}
    school-name: ${DEV_SCHOOL_NAME:École Pilote iziSchool}
    school-code: ${DEV_SCHOOL_CODE:PILOTE-01}
    admin-email: ${DEV_ADMIN_EMAIL:admin@izischool.com}
    admin-first-name: ${DEV_ADMIN_FIRSTNAME:Admin}
    admin-last-name: ${DEV_ADMIN_LASTNAME:Principal}
    keycloak-user-id: ${DEV_ADMIN_KEYCLOAK_ID:dev-default-admin-id}

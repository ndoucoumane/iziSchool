spring:
  application:
    name: izischool-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/iziSchool}
          #jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/iziSchool/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8081}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

izischool:
  default-currency: ${DEFAULT_CURRENCY:XOF}
  default-timezone: ${DEFAULT_TIMEZONE:UTC}
  security:
    #auth-enabled: ${AUTH_ENABLED:true}
    auth-enabled: true
    jwt:
      client-id: ${KEYCLOAK_CLIENT_ID:izischool-backend}
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:iziSchool}
    client-id: ${KEYCLOAK_CLIENT_ID:izischool-backend}
    auth-client-id: ${KEYCLOAK_AUTH_CLIENT_ID:izischool-frontend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/iziSchool}
    openid-configuration-url: ${KEYCLOAK_OPENID_CONFIG_URL:http://localhost:8180/realms/iziSchool/.well-known/openid-configuration}
  dev-seed:
    enabled: ${DEV_SEED_ENABLED:true}
    school-name: ${DEV_SCHOOL_NAME:École Pilote iziSchool}
    school-code: ${DEV_SCHOOL_CODE:PILOTE-01}
    admin-email: ${DEV_ADMIN_EMAIL:admin@izischool.com}
    admin-first-name: ${DEV_ADMIN_FIRSTNAME:Admin}
    admin-last-name: ${DEV_ADMIN_LASTNAME:Principal}
    keycloak-user-id: ${DEV_ADMIN_KEYCLOAK_ID:dev-default-admin-id}
